syntax = "proto3";

package rin.judge.v1;

option go_package = "github.com/rin-oj/rin-oj/packages/sdk-go/rin/judge/v1;judgev1";

service JudgeDispatcherService {
  rpc Submit(JudgeRequest) returns (stream JudgeResult);
  rpc Languages(ListJudgeLanguagesRequest) returns (ListJudgeLanguagesResponse);
  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);
}

message JudgeRequest {
  string submission_id = 1;
  string problem_id = 2;
  string language_id = 3;
  string source_object_key = 4;
  repeated TestCase test_cases = 5;
  ResourceLimit limit = 6;
}

message TestCase {
  string test_case_id = 1;
  string input_object_key = 2;
  string output_object_key = 3;
  int32 subtask_index = 4;
}

message ResourceLimit {
  int64 cpu_time_ms = 1;
  int64 wall_time_ms = 2;
  int64 memory_bytes = 3;
  int64 stack_bytes = 4;
  int64 output_bytes = 5;
}

message JudgeResult {
  string submission_id = 1;
  string test_case_id = 2;
  string status = 3;
  int64 time_ms = 4;
  int64 memory_bytes = 5;
  string message = 6;
  bool final = 7;
}

message ListJudgeLanguagesRequest {}

message JudgeLanguage {
  string language_id = 1;
  string display_name = 2;
  string version = 3;
  repeated string compile_flags = 4;
}

message ListJudgeLanguagesResponse {
  repeated JudgeLanguage languages = 1;
}

message HealthCheckRequest {}

message HealthCheckResponse {
  bool healthy = 1;
  string provider = 2;
  string version = 3;
}
